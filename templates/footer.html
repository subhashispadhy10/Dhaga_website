{% load static %}
<footer class="footer">
  <span class="logo">dhaga<span>.</span></span>
  <p>© 2026 Dhaga. Made in India.</p>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart" aria-hidden="true">
  <div class="drawer-head"><h2>Your cart</h2><button id="closeCart" aria-label="Close cart">✕</button></div>
  <div class="drawer-body" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="row"><span>Subtotal</span><b id="subtotal">₹0</b></div>
    <p class="note" id="shipNote"></p>
    <button class="btn full" id="checkout">Checkout</button>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>

<!-- Django: <script src="{% static 'js/script.js' %}"></script> -->
<script src="{% static 'script.js' %}"></script>
<script src="{% static 'product.js' %}"></script>
